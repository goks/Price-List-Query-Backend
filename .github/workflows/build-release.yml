name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Restore Firebase service account
        shell: powershell
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_SERVICE_ACCOUNT_JSON)) {
            throw "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON."
          }
          New-Item -ItemType Directory -Force -Path ".\service-account" | Out-Null
          $target = ".\service-account\gokul-agencies-firebase-adminsdk-ti855-702f214fc5.json"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($target, $env:FIREBASE_SERVICE_ACCOUNT_JSON, $utf8NoBom)

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build executable and installer
        shell: powershell
        run: .\scripts\build_release.ps1

      - name: Read version
        id: version
        shell: powershell
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-v${{ steps.version.outputs.version }}
          path: |
            dist/Price List Update.exe
            Price List Update-installer.exe

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Price List Update.exe
            Price List Update-installer.exe
          generate_release_notes: true
