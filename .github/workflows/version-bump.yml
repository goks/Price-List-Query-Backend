name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version part to bump
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      set_version:
        description: Explicit version to set instead of bumping, e.g. 1.2.3
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump version files
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.set_version }}" ]; then
            version=$(python scripts/bump_version.py --set-version "${{ inputs.set_version }}")
          else
            version=$(python scripts/bump_version.py --bump "${{ inputs.bump }}")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_version.py installer.nsi
          git commit -m "chore: bump version to v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$BRANCH_NAME"
          git push origin "v$VERSION"
